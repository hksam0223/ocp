<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>海洋公園：深海異聞錄 (全平台自適應版)</title>
    <style>
        :root {
            --bg-color: #030712;
            --max-game-width: 480px; /* 電腦端最大寬度 */
            --text-color: #d1d5db;
            --accent-color: #38bdf8;
            --danger-color: #ef4444;
            --energy-color: #f59e0b;
            --panel-bg: rgba(17, 24, 39, 0.95);
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 核心：自適應遊戲容器 */
        #game-container {
            width: 100%;
            max-width: var(--max-game-width); /* 大螢幕限制最大寬度，小螢幕 100% 滿版 */
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            margin: 0 auto;
        }

        /* 大螢幕時顯示精緻邊框與陰影；小螢幕自動無縫滿版 */
        @media (min-width: 481px) {
            #game-container {
                border-left: 1px solid var(--border-color);
                border-right: 1px solid var(--border-color);
                box-shadow: 0 0 35px rgba(0, 0, 0, 0.85);
            }
        }

        /* 開頭封面 */
        #title-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(3,7,18,0.96) 0%, rgba(11,17,30,0.98) 100%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px;
            text-align: center;
            overflow-y: auto;
        }

        .title-header { margin-top: 10px; }
        .title-tag { color: var(--accent-color); font-size: clamp(11px, 3vw, 13px); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
        .title-main { font-size: clamp(22px, 6vw, 28px); font-weight: 800; color: #f3f4f6; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); margin-bottom: 6px; }
        .title-sub { font-size: clamp(12px, 3.2vw, 14px); color: #9ca3af; }

        .story-intro-box {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-color);
            padding: 14px;
            border-radius: 8px;
            text-align: left;
            font-size: clamp(12px, 3.5vw, 14px);
            line-height: 1.6;
            color: #d1d5db;
            margin: 16px 0;
        }

        .title-buttons { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
        .btn-start {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff; padding: 14px; border-radius: 8px; font-weight: bold; font-size: clamp(15px, 4vw, 17px);
            border: 1px solid #38bdf8; cursor: pointer; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn-load-title { background: #1f2937; color: #9ca3af; padding: 12px; border-radius: 8px; font-size: clamp(13px, 3.5vw, 14px); border: 1px solid #374151; cursor: pointer; }

        /* 特效 */
        .flash-effect { animation: flashRed 0.4s ease-in-out; }
        @keyframes flashRed {
            0% { background-color: rgba(239, 68, 68, 0.5); }
            100% { background-color: transparent; }
        }
        .insane { animation: insaneDistort 3s infinite alternate; }
        @keyframes insaneDistort {
            0% { filter: hue-rotate(0deg) contrast(100%); }
            100% { filter: hue-rotate(-30deg) contrast(120%); }
        }

        /* 頂部固定狀態欄 (適應瀏海屏) */
        .status-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--panel-bg);
            padding: calc(10px + env(safe-area-inset-top)) 12px 10px 12px;
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            font-size: clamp(11px, 3vw, 13px);
            backdrop-filter: blur(8px);
        }

        .status-item { display: flex; align-items: center; gap: 6px; }
        .bar-container { flex: 1; height: 8px; background: #374151; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.3s ease; }
        .hp-fill { background: #ef4444; }
        .san-fill { background: #8b5cf6; }

        .system-controls {
            grid-column: span 2;
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin-top: 2px;
            padding-top: 6px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .btn-sys {
            background: #1f2937; color: #38bdf8; border: 1px solid #38bdf8;
            padding: 6px 4px; border-radius: 6px; font-size: clamp(10px, 2.8vw, 12px); cursor: pointer; flex: 1; text-align: center;
        }
        .btn-sys-ad { color: #f59e0b; border-color: #f59e0b; }

        .location-banner {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 8px 14px;
            font-size: clamp(12px, 3.5vw, 14px);
            font-weight: bold;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
        }

        /* 劇情文字區域 */
        .text-area {
            padding: 16px;
            font-size: clamp(14px, 4vw, 16px);
            line-height: 1.65;
            white-space: pre-line;
            color: #e5e7eb;
            min-height: 120px;
            flex-grow: 1;
        }

        .inventory-bar {
            padding: 8px 14px;
            background: rgba(17, 24, 39, 0.5);
            border-top: 1px solid var(--border-color);
            font-size: clamp(11px, 3vw, 13px);
            color: #9ca3af;
            overflow-x: auto;
            white-space: nowrap;
        }

        /* 選項區 (適應全面屏底部) */
        .options-container {
            padding: 12px 14px calc(20px + env(safe-area-inset-bottom)) 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        .btn {
            background: #1f2937;
            color: #f3f4f6;
            border: 1px solid #374151;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: clamp(13px, 3.8vw, 15px);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-cost {
            font-size: 11px;
            color: var(--energy-color);
            background: rgba(245, 158, 11, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            white-space: nowrap;
        }

        .btn:active { background: #374151; transform: scale(0.99); }
        .btn-danger { border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.1); }
        .btn-egg { border-color: rgba(168, 85, 247, 0.6); background: rgba(168, 85, 247, 0.12); color: #e9d5ff; }
        .btn-disabled { opacity: 0.4; cursor: not-allowed; }

        /* 彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: var(--accent-color); }
        .ad-option-btn {
            width: 100%; margin-bottom: 10px; padding: 12px; background: #1e293b;
            border: 1px solid #3b82f6; color: #fff; border-radius: 8px; font-size: 13px;
            cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

<!-- 本地背景音樂檔組件 (讀取同目錄下的 bgm.mp3) -->
<audio id="local-bgm-player" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
</audio>

<div id="game-container">
    <!-- 開頭封面 -->
    <div id="title-screen">
        <div class="title-header">
            <div class="title-tag">HONG KONG URBAN LEGEND</div>
            <div class="title-main">海洋公園：深海異聞錄</div>
            <div class="title-sub">自適應畫面與本地音樂版</div>
        </div>

        <div class="story-intro-box">
            <strong>📖 背景簡述：</strong><br>
            1977年開園以來，香港海洋公園依山傍海。然而，歷年發生的奇異故障、鬼屋事故與無法解釋的溺水傳説，讓園區底層積聚了沉重的怨氣。<br><br>
            今夜，園區突然宣布封閉。深海中的遠古異物受到怨念召喚甦醒，整座公園陷入了無盡的黑夜與狂氣之中……
        </div>

        <div class="title-buttons">
            <button class="btn-start" onclick="startGameFromTitle()">👁️ 開始調查 (NEW GAME)</button>
            <button class="btn-load-title" onclick="loadGameFromTitle()">📂 繼續調查 (LOAD GAME)</button>
        </div>
    </div>

    <!-- 頂部狀態欄 -->
    <div class="status-bar">
        <div class="status-item">
            <span>HP</span>
            <div class="bar-container"><div id="hp-bar" class="bar-fill hp-fill" style="width: 100%;"></div></div>
            <span id="hp-val">100</span>
        </div>
        <div class="status-item">
            <span>SAN</span>
            <div class="bar-container"><div id="san-bar" class="bar-fill san-fill" style="width: 100%;"></div></div>
            <span id="san-val">100</span>
        </div>
        <div class="status-item">
            <span>⚡ 體力: <strong id="energy-val">8/8</strong></span>
        </div>
        <div class="status-item">
            <span>🕒 時間: <strong id="time-val">18:30</strong></span>
        </div>
        
        <div class="system-controls">
            <button class="btn-sys" id="music-btn" onclick="toggleAudio()">🎵 音效/BGM: 開</button>
            <button class="btn-sys" onclick="saveGame()">💾 儲存</button>
            <button class="btn-sys" onclick="loadGame()">📂 讀取</button>
            <button class="btn-sys btn-sys-ad" onclick="openAdMenu()">📺 補給</button>
        </div>
    </div>

    <!-- 場景標題 -->
    <div class="location-banner">
        <span id="location-name">未知區域</span>
        <span id="role-name" style="opacity: 0.75;">難度 / 身份未選擇</span>
    </div>

    <!-- 劇情主文字 -->
    <div class="text-area" id="story-text" onclick="skipTypewriter()"></div>

    <!-- 道具欄 -->
    <div class="inventory-bar" id="inventory-display">
        🎒 道具: 無
    </div>

    <!-- 操作選項區 -->
    <div class="options-container" id="options"></div>

    <!-- 補給彈窗 -->
    <div id="ad-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">📺 補給站</div>
            <p style="margin-bottom: 16px; font-size: 13px; color: #9ca3af;">選擇觀看贊助廣告以獲得生存補給：</p>
            
            <button class="ad-option-btn" onclick="watchAd('energy')">
                <span>⚡ 園區安全廣告</span>
                <span style="color: #f59e0b;" id="ad-energy-text">恢復滿體力</span>
            </button>
            <button class="ad-option-btn" onclick="watchAd('hp')">
                <span>❤️ 醫療急救物資廣告</span>
                <span style="color: #ef4444;" id="ad-hp-text">恢復 HP</span>
            </button>
            <button class="ad-option-btn" onclick="watchAd('san')">
                <span>🧠 心靈舒心音樂廣告</span>
                <span style="color: #8b5cf6;" id="ad-san-text">恢復 SAN</span>
            </button>

            <button class="btn btn-danger" style="width: 100%; text-align: center; justify-content: center; margin-top: 6px;" onclick="closeAdMenu()">返回遊戲</button>
        </div>
    </div>
</div>

<script>
    // === 音效與本地 BGM 播放器控制 ===
    let audioCtx = null;
    let audioMuted = false;
    let synthBgmInterval = null;
    let currentBgmTrack = "";

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playBgm(trackName) {
        if (currentBgmTrack === trackName) return;
        currentBgmTrack = trackName;

        if (audioMuted) return;
        initAudio();

        const bgmPlayer = document.getElementById('local-bgm-player');
        
        bgmPlayer.play().then(() => {
            stopSynthBgm();
        }).catch(() => {
            playSynthBgm(trackName);
        });
    }

    function stopBgm() {
        const bgmPlayer = document.getElementById('local-bgm-player');
        bgmPlayer.pause();
        stopSynthBgm();
    }

    function playSynthBgm(trackName) {
        stopSynthBgm();
        if (audioMuted || !audioCtx) return;

        synthBgmInterval = setInterval(() => {
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(50, now);
            osc.frequency.exponentialRampToValueAtTime(35, now + 2.5);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 2.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 2.5);
        }, 3000);
    }

    function stopSynthBgm() {
        if (synthBgmInterval) {
            clearInterval(synthBgmInterval);
            synthBgmInterval = null;
        }
    }

    function playSfx(type) {
        if (audioMuted) return;
        initAudio();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'sfx_click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
        } else if (type === 'sfx_damage') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'sfx_warning') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.setValueAtTime(200, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
    }

    function toggleAudio() {
        audioMuted = !audioMuted;
        const btn = document.getElementById('music-btn');
        if (audioMuted) {
            btn.innerText = "🎵 音效/BGM: 關";
            stopBgm();
        } else {
            btn.innerText = "🎵 音效/BGM: 開";
            let track = currentBgmTrack;
            currentBgmTrack = "";
            playBgm(track || "bgm_explore");
        }
    }

    // === 遊戲數據狀態 ===
    let state = {
        difficulty: "normal",
        role: "未選擇",
        hp: 100,
        san: 100,
        energy: 8,
        maxEnergy: 8,
        timeMinutes: 18 * 60 + 30,
        items: [],
        currentSceneKey: "select_difficulty"
    };

    let isTyping = false;
    let typeWriterTimer = null;
    let fullTextToType = "";

    function startGameFromTitle() {
        initAudio();
        playSfx("sfx_click");
        document.getElementById('title-screen').style.display = 'none';
        loadScene('select_difficulty');
    }

    function loadGameFromTitle() {
        initAudio();
        playSfx("sfx_click");
        const savedData = localStorage.getItem("ocean_park_save");
        if (!savedData) {
            alert("📂 找不到儲存紀錄！");
            return;
        }
        document.getElementById('title-screen').style.display = 'none';
        loadGame();
    }

    // === 劇本資料庫 ===
    const scenes = {
        select_difficulty: {
            loc: "遊戲選項 - 難度設定",
            bgm: "bgm_explore",
            text: "【海洋公園怪談提示】\n夜幕下的海洋公園並不屬於人類。請選擇生存難度：\n\n🟢 【簡單模式】：體力上限高（12點），廣告補給充沛。\n🟡 【普通模式】：標準克蘇魯恐怖體驗（8點體力）。\n🔴 【噩夢模式】：體力上限極低（5點），精神與體能消耗極快！",
            options: [
                { text: "🟢 簡單模式 (Easy)", nextScene: "select_role", initDiff: "easy", energyCost: 0 },
                { text: "🟡 普通模式 (Normal)", nextScene: "select_role", initDiff: "normal", energyCost: 0 },
                { text: "🔴 噩夢模式 (Hard)", nextScene: "select_role", initDiff: "hard", energyCost: 0 }
            ]
        },

        select_role: {
            loc: "香港海洋公園 - 入口閘門",
            bgm: "bgm_explore",
            text: "黃昏的最後一絲餘暉被漆黑的海岸線吞噬。\n園區廣播喇叭突然傳來極度扭曲的童聲合唱。你站在關閉的入口前，決定你的身份：",
            options: [
                { text: "1. 園區員工（持有【管理員鑰匙卡】，了解暗道，SAN 80）", nextScene: "park_entrance", initRole: "staff", energyCost: 0 },
                { text: "2. 探險網紅（自帶【高光手電筒】，HP 80）", nextScene: "park_entrance", initRole: "streamer", energyCost: 0 },
                { text: "3. 靈異研究員（自帶【鎮宅靈符】，對精神衝擊有強抵抗）", nextScene: "park_entrance", initRole: "researcher", energyCost: 0 }
            ]
        },

        park_entrance: {
            loc: "海濱樂園 - 夢幻水都",
            bgm: "bgm_explore",
            text: "巨型水族箱內漂浮著無數看似人形的黑影……空氣中瀰漫著濃重的海水鹹味。",
            options: [
                { text: "1. 走向「香港老大街」（傳出舊時代廣播聲）", nextScene: "old_hong_kong", timeCost: 10, sanChange: -3, energyCost: 1 },
                { text: "2. 進入「亞洲動物天地」（竹林傳出咀嚼聲）", nextScene: "panda_pavilion", timeCost: 10, sanChange: -5, energyCost: 1 },
                { text: "3. 前往「海洋列車」車站嘗試上山", nextScene: "ocean_express_station", timeCost: 15, sanChange: -5, energyCost: 2 },
                { text: "4. 前往「登山纜車」車站（高空傳來金屬摩擦聲）", nextScene: "cable_car_station", timeCost: 15, sanChange: -5, energyCost: 2 }
            ]
        },

        old_hong_kong: {
            loc: "海濱樂園 - 香港老大街",
            bgm: "bgm_explore",
            text: "無人開動的叮叮車響起車鈴，車廂窗口貼著數張慘白的人臉。舊式冰室裡收音機播放著過期的悼念新聞。",
            options: [
                { text: "1. 冒險搜刮舊冰室櫃檯", nextScene: "old_hong_kong_loot", timeCost: 10, getItem: "古舊硬幣(1/3)", sanChange: -8, energyCost: 1 },
                { text: "2. 進入舊日軍防空洞通道（需要管理員鑰匙卡）", nextScene: "bunker_entrance", timeCost: 15, reqItem: "管理員鑰匙卡", failScene: "bunker_locked", energyCost: 2 },
                { text: "3. 退回夢幻水都廣場", nextScene: "park_entrance", timeCost: 10, sanChange: -2, energyCost: 1 }
            ]
        },

        old_hong_kong_loot: {

    function formatTime(totalMinutes) {
        let hrs = Math.floor(totalMinutes / 60) % 24;
        let mins = totalMinutes % 60;
        return `${hrs < 10 ? "0" + hrs : hrs}:${mins < 10 ? "0" + mins : mins}`;
    }

    function saveGame() {
        if (state.currentSceneKey === "select_difficulty" || state.currentSceneKey === "select_role") {
            alert("⚠️ 尚未正式開始冒險，無法儲存進度！");
            return;
        }
        try {
            localStorage.setItem("ocean_park_save", JSON.stringify(state));
            playSfx("sfx_click");
            alert("💾 進度已成功儲存！");
        } catch (e) {
            alert("❌ 儲存失敗。");
        }
    }

    function loadGame() {
        const savedData = localStorage.getItem("ocean_park_save");
        if (!savedData) {
            alert("📂 找不到儲存紀錄！");
            return;
        }
        try {
            state = JSON.parse(savedData);
            playSfx("sfx_click");
            loadScene(state.currentSceneKey);
            alert("📂 讀取成功！");
        } catch (e) {
            alert("❌ 讀檔失敗。");
        }
    }

    function initDifficulty(diff) {
        state.difficulty = diff;
        state.maxEnergy = diff === "easy" ? 12 : (diff === "hard" ? 5 : 8);
        state.energy = state.maxEnergy;
    }

    function initRoleStats(roleType) {
        state.hp = 100;
        state.san = 100;
        state.energy = state.maxEnergy;
        state.timeMinutes = 18 * 60 + 30;
        state.items = ["園區地圖"];

        let diffLabel = state.difficulty === "easy" ? "🟢簡單" : (state.difficulty === "normal" ? "🟡普通" : "🔴噩夢");

        if (roleType === "staff") {
            state.role = `${diffLabel} | 員工`;
            state.san = state.difficulty === "hard" ? 60 : 80;
            state.items.push("管理員鑰匙卡");
        } else if (roleType === "streamer") {
            state.role = `${diffLabel} | 網紅`;
            state.hp = state.difficulty === "hard" ? 60 : 80;
            state.items.push("高光手電筒");
        } else if (roleType === "researcher") {
            state.role = `${diffLabel} | 研究員`;
            state.items.push("鎮宅靈符");
        }
    }

    function typeWriter(text, callback) {
        isTyping = true;
        fullTextToType = text;
        const textContainer = document.getElementById('story-text');
        textContainer.innerText = "";
        let index = 0;

        clearInterval(typeWriterTimer);
        typeWriterTimer = setInterval(() => {
            if (index < text.length) {
                textContainer.innerText += text.charAt(index);
                index++;
            } else {
                clearInterval(typeWriterTimer);
                isTyping = false;
                if (callback) callback();
            }
        }, 20);
    }

    function skipTypewriter() {
        if (isTyping) {
            clearInterval(typeWriterTimer);
            document.getElementById('story-text').innerText = fullTextToType;
            isTyping = false;
            renderCurrentOptions();
        }
    }

    function updateUI(locName) {
        document.getElementById('hp-val').innerText = state.hp;
        document.getElementById('hp-bar').style.width = state.hp + "%";
        document.getElementById('san-val').innerText = state.san;
        document.getElementById('san-bar').style.width = state.san + "%";
        document.getElementById('energy-val').innerText = `${state.energy}/${state.maxEnergy}`;
        document.getElementById('time-val').innerText = formatTime(state.timeMinutes);
        
        document.getElementById('location-name').innerText = locName || "海洋公園";
        document.getElementById('role-name').innerText = state.role;

        document.getElementById('inventory-display').innerText = "🎒 道具: " + (state.items.length > 0 ? state.items.join(" | ") : "無");

        const container = document.getElementById('game-container');
        if (state.san <= 40) {
            container.classList.add('insane');
        } else {
            container.classList.remove('insane');
        }

        let gain = state.difficulty === "easy" ? 50 : (state.difficulty === "hard" ? 15 : 30);
        document.getElementById('ad-hp-text').innerText = `恢復 +${gain} HP`;
        document.getElementById('ad-san-text').innerText = `恢復 +${gain} SAN`;
    }

    function makeChoice(opt) {
        if (isTyping) {
            skipTypewriter();
            return;
        }

        playSfx("sfx_click");

        if (opt.nextScene === "return_title") {
            document.getElementById('title-screen').style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
        }

        const cost = opt.energyCost !== undefined ? opt.energyCost : 1;

        if (opt.initDiff) {
            initDifficulty(opt.initDiff);
        } else if (opt.initRole) {
            initRoleStats(opt.initRole);
        } else {
            if (state.currentSceneKey !== 'select_difficulty' && state.currentSceneKey !== 'select_role' && state.energy < cost) {
                playSfx("sfx_warning");
                alert(`⚡ 體力不足！需要 ${cost} 點體力。請點擊「觀看廣告」獲取補充！`);
                openAdMenu();
                return;
            }

            if (opt.reqItem && !state.items.includes(opt.reqItem)) {
                loadScene(opt.failScene || opt.nextScene);
                return;
            }

            state.energy -= cost;

            let diffMult = state.difficulty === "hard" ? 1.3 : 1.0;

            if (opt.timeCost) state.timeMinutes += opt.timeCost;
            if (opt.hpChange) {
                let hpDiff = opt.hpChange < 0 ? Math.round(opt.hpChange * diffMult) : opt.hpChange;
                state.hp = Math.max(0, Math.min(100, state.hp + hpDiff));
                if (hpDiff < 0) triggerFlash();
            }
            if (opt.sanChange) {
                let sanDiff = opt.sanChange < 0 ? Math.round(opt.sanChange * diffMult) : opt.sanChange;
                state.san = Math.max(0, Math.min(100, state.san + sanDiff));
                if (sanDiff < 0) triggerFlash();
            }
            if (opt.getItem && !state.items.includes(opt.getItem)) {
                state.items.push(opt.getItem);
            }
        }

        if (state.hp <= 0) {
            loadScene("game_over_hp");
            return;
        }
        if (state.san <= 0) {
            loadScene("game_over_san");
            return;
        }

        loadScene(opt.nextScene);
    }

    function triggerFlash() {
        playSfx("sfx_damage");
        let container = document.getElementById('game-container');
        container.classList.add('flash-effect');
        setTimeout(() => container.classList.remove('flash-effect'), 400);
    }

    function renderCurrentOptions() {
        const scene = scenes[state.currentSceneKey];
        const optContainer = document.getElementById('options');
        optContainer.innerHTML = '';

        if (!scene || !scene.options) return;

        scene.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';

            if (opt.isEgg) {
                btn.classList.add('btn-egg');
            }

            const cost = opt.energyCost !== undefined ? opt.energyCost : 1;

            const textSpan = document.createElement('span');
            textSpan.innerText = opt.text;
            btn.appendChild(textSpan);

            if (state.currentSceneKey !== 'select_difficulty' && state.currentSceneKey !== 'select_role' && cost > 0) {
                const costSpan = document.createElement('span');
                costSpan.className = 'btn-cost';
                costSpan.innerText = `⚡ -${cost}`;
                btn.appendChild(costSpan);
            }

            if (opt.hpChange < -10 || opt.sanChange < -15) {
                btn.classList.add('btn-danger');
            }

            if (state.currentSceneKey !== 'select_difficulty' && state.currentSceneKey !== 'select_role' && state.energy < cost) {
                btn.classList.add('btn-disabled');
            }

            btn.onclick = () => makeChoice(opt);
            optContainer.appendChild(btn);
        });
    }

    function loadScene(sceneKey) {
        state.currentSceneKey = sceneKey;
        const scene = scenes[sceneKey];
        if (!scene) return;

        if (scene.bgm) {
            playBgm(scene.bgm);
        }

        updateUI(scene.loc);
        typeWriter(scene.text, () => {
            renderCurrentOptions();
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openAdMenu() {
        playSfx("sfx_click");
        document.getElementById('ad-modal').style.display = 'flex';
    }

    function closeAdMenu() {
        playSfx("sfx_click");
        document.getElementById('ad-modal').style.display = 'none';
    }

    function watchAd(type) {
        let gain = state.difficulty === "easy" ? 50 : (state.difficulty === "hard" ? 15 : 30);

        if (type === 'energy') {
            state.energy = state.maxEnergy;
            alert("📺 觀看完成！【⚡ 體力】已補充完畢！");
        } else if (type === 'hp') {
            state.hp = Math.min(100, state.hp + gain);
            alert(`📺 觀看完成！成功領取急救物資，【HP】恢復 ${gain} 點！`);
        } else if (type === 'san') {
            state.san = Math.min(100, state.san + gain);
            alert(`📺 觀看完成！聆聽舒心音樂，【SAN】精神值恢復 ${gain} 點！`);
        }
        
        closeAdMenu();
        updateUI(scenes[state.currentSceneKey].loc);
        renderCurrentOptions();
    }
</script>
</body>
</html>
